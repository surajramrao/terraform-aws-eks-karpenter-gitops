name: "03 — Scheduled Infrastructure Drift Detection (Dev & Prod)"

on:
  schedule:
    - cron: "0 6 * * 1-5" # Every weekday at 06:00 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  detect-state-drift:
    name: "Drift Audit (${{ matrix.env }})"
    if: vars.AWS_OIDC_ROLE_ARN != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS OIDC Federation
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Initialize & Run Detailed-Exitcode Drift Check
        id: drift
        continue-on-error: true
        run: |
          terraform init -input=false
          set +e
          terraform plan -detailed-exitcode -input=false -no-color > drift.txt
          EXIT_CODE=$?
          echo "exitcode=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit 0

      - name: Open GitHub Issue on Out-of-Band Infrastructure Drift (Exit Code 2)
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('environments/${{ matrix.env }}/drift.txt', 'utf8').slice(0, 50000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[DRIFT DETECTED] Out-of-band cloud changes in environments/${{ matrix.env }}`,
              body: `Scheduled drift detection (\`terraform plan -detailed-exitcode\`) returned exit code \`2\` for **\`environments/${{ matrix.env }}\`**.

\`\`\`terraform
${diff}
\`\`\``,
              labels: ['drift-detection', 'security', '${{ matrix.env }}']
            });
